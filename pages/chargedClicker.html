
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>chargedClicker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .spacer{
      margin-top:6%;
      margin-bottom: 2%;
    }

    .container {
      background: #ffffff;
      margin-top: 20px;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      margin-left: 30%;
      margin-right: 30%;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    .status {
      text-align: center;
      font-weight: 600;
      margin-bottom: 10px;
      color: #28a745;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 5px 10px;
      margin: 10px 0 20px;
      border: 1px solid  #0056b3;
      border-radius: 8px;
      font-size: 16px;
    }

    .interval {
      width: 100%;
      padding: 5px 10px;
      margin: 10px 0 20px;
      border: 1px solid  #0056b3;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 16px;
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;

      transition: transform 0.3s ease, box-shadow 0.3s ease;
      transform: perspective(600px) translateZ(0);
    }

    button:hover{
      transform: perspective(600px) translateZ(20px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .special-p {
      padding: 10px 16px;
      background-color: rgb(3, 68, 3);
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 70%;
      padding-left: 20%;

    }

    button:hover {
      background-color: #0056b3;
    }

    .info-text {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
      color: #666;
    }

    .label {
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }

    .btn-div{
      perspective: 800px;
      display: inline-block;
    }

    #token-input:active{
      border-color: 1px solid  #0056b3;
    }

    .key-save-status{
      color: darkgreen;
      font-weight: 500px;
    }

    h1{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-weight: 600px;
      letter-spacing: 1px;
    }
  </style>

<script src="../scripts/popup.js" type="module"></script>
</head>
<body>
  <div class="container">
    <h1>chargedClicker</h1>
    <div class="status">Subscription Status:<label id="status-label">Active</label></div>

    <label class="label">Enter Subscription Token:</label>
    <input type="text" placeholder="Token" id="token-input"/>
    
    <button id="validation-button">Validate Token</button>

    <p>Total Days:<label id="days-label">10 days</label> </p>
    <p>Remaining Days: <label id="days-remaining-label">10 days</label></p>
    <p>Maximum Tabs: <label id="tabs-label">4 tabs</label></p>
    <p class="special-p">Control Key:<label id="validation-text">Space</label></p>

    <div class="spacer">
      <label class="label">Select Time frame:</label>
      <select id="timeframe-select">
        <option>millisec</option>
        <option>sec</option>
        <option>mins</option>
        <option>hours</option>
      </select>
    </div>

    <label class="label">Select Interval:</label>
    <input type="number" value="5000" id="interval" max="10000" min="0" class="interval"/>

    <label class="label">Select Key for Control:</label>
    <input type="text" id="hot-key" />
    <label id="key-save-status" class="key-save-status"></label>

    <button  id="start-button" class="btn-success" onClick="alert('button clicked')">Start(click twice)</button>
  
    <div class="info-text">
      Contact us on: +256741882818<br>
      Email: tezoschain958@gmail.com
    </div>
  </div>
</body>
</html>
