<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>X-Linter</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .header {
display: flex;
justify-content: center;
align-items: center;
width: 60%;
height: 90px;
margin: 20px auto;
border-radius: 15px;
background: linear-gradient(90deg, rgba(16,185,129,.45), rgba(6,182,212,.45));
box-shadow: 0 0 20px rgba(16,185,129,.45), 0 0 30px rgba(6,182,212,.45);
position: relative;
animation: pulseGlow 2.5s infinite ease-in-out;
}


@keyframes pulseGlow {
0% {
box-shadow: 0 0 20px rgba(16,185,129,.45), 0 0 30px rgba(6,182,212,.45);
transform: scale(1);
}
50% {
box-shadow: 0 0 35px rgba(16,185,129,.7), 0 0 50px rgba(6,182,212,.7);
transform: scale(1.02);
}
100% {
box-shadow: 0 0 20px rgba(16,185,129,.45), 0 0 30px rgba(6,182,212,.45);
transform: scale(1);
}
}


.logo {
font-size: 2.2rem;
font-weight: 900;
letter-spacing: 2px;
color: #ffffff;
text-transform: uppercase;
text-shadow:
0 0 10px rgba(16,185,129,.75),
0 0 20px rgba(6,182,212,.75);
animation: softPulse 1.8s infinite alternate ease-in-out;
z-index: 2;
}


@keyframes softPulse {
0% {
text-shadow:
0 0 10px rgba(16,185,129,.75),
0 0 20px rgba(6,182,212,.75);
}
100% {
text-shadow:
0 0 15px rgba(16,185,129,1),
0 0 30px rgba(6,182,212,1);
}
}
    /* Small self-contained styles for new UI pieces */
    .save-area {
      margin: 18px 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .glow-save {
      --btn-bg: linear-gradient(135deg,#10b981,#06b6d4);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: .2px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(6,182,212,.15), 0 0 28px rgba(16,185,129,.08);
      background: var(--btn-bg);
      color: white;
      position: relative;
      overflow: visible;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .glow-save:hover{ transform: translateY(-2px); }

    /* pulsing glow */
    .glow-save::after{
      content: '';
      position: absolute;
      left: -6px; right: -6px; top: -6px; bottom: -6px;
      z-index: -1;
      border-radius: 14px;
      filter: blur(12px);
      opacity: .75;
      background: linear-gradient(90deg, rgba(16,185,129,.45), rgba(6,182,212,.45));
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse{
      0%{ transform: scale(.95); opacity:.6 }
      50%{ transform: scale(1.06); opacity:1 }
      100%{ transform: scale(.95); opacity:.6 }
    }

    .status-pill{
      display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#0f172a;color:#fff;font-weight:600
    }

    .small-muted{font-size:13px;color:var(--muted,#6b7280)}

    .hidden{ display:none !important }

  </style>
</head>
<body>

    <!-- === REPLACED: customer images + progress widget === -->

      <div class="save-area">
