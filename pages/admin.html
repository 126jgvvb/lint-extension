        const generateToken=()=>{

                alert('Invalid input...');
                return;
            }

            const obj={
                days:days,
                tabCount:tabCount,
                initialDate:(Date.now())
            }

            
const encryptObj=(obj)=>{

    let cipherText='';

   // alert(srtingifiedObj);

    for(let i=0; i<srtingifiedObj.length; ++i){
        cipherText+=String.fromCharCode(srtingifiedObj.charCodeAt(i)^secret.charCodeAt(i%secret.length));

 //   decryptToken(toBase64Obj);
    return document.getElementById('token').innerText=toBase64Obj;
    }
        

encryptObj(obj);

const decryptToken=(token)=>{

        let str='';

//alert(`parsed object: ${JSON.parse(str).initialDate}`);

const copyToClipboard=()=>{
    const data=document.getElementById('token').innerHTML;
  //  alert(data);
    navigator.clipboard.writeText(data)
    .then((result)=>{
        document.getElementById('copy-xcter').innerText='Copied to clipboard';
        console.log('Token copied to clipboard');
    })
    .catch(e=>{
        console.log('Error while copying to clipboard:',e);
    })
}
